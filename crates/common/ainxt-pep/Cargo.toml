[package]
license = "Apache-2.0"
name = "ainxt-pep"
version = "0.1.0"
edition.workspace = true
description = "Policy Enforcement Point: the single place a tool action is authorized."

[dependencies]
ainxt-audit = { workspace = true }
ainxt-intent = { workspace = true }
ainxt-policy = { workspace = true }
ainxt-policy-types = { workspace = true }
ainxt-session-risk = { workspace = true }
arc-swap = { workspace = true }
blake3 = { workspace = true }
gethostname = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
# `install_scoped` / `reset_for_test` are feature-gated upstream so production
# builds cannot reach them.
ainxt-policy = { workspace = true, features = ["test-support"] }
ainxt-audit = { workspace = true, features = ["test-support"] }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
