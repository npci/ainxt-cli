[package]
publish.workspace = true
license = "Apache-2.0"
name = "ainxt-http"
version = "0.1.0"
edition.workspace = true
description = "Shared reqwest HTTP clients and User-Agent construction for the ainxt CLI."

[dependencies]
reqwest = { workspace = true, features = ["blocking"] }
reqwest-middleware = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
ainxt-auth = { workspace = true, features = ["middleware"] }
ainxt-sampler = { path = "../ainxt-sampler" }
ainxt-telemetry = { workspace = true }
ainxt-version = { workspace = true }
ainxt-workspace = { workspace = true }

[lints]
workspace = true
