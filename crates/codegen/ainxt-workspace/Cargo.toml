[package]
publish.workspace = true
license = "Apache-2.0"
name = "ainxt-workspace"
version = "0.1.220-alpha.4"
edition.workspace = true
description = "Core host-local workspace library (FS, VCS, execution, discovery) for ainxt-shell and remote sampler"

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
# Diagnostics HTTP server (in-guest readiness/status endpoint); pinned to the
# workspace version already used by the sibling preview proxy.
axum = { workspace = true }
dunce = { workspace = true }
ainxt-version = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
fs2 = { workspace = true }
dirs = "6"
parking_lot = { workspace = true }
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
ignore = { workspace = true }
md5 = { workspace = true }
regex = { workspace = true }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "fs",
    "io-std",
    "macros",
    "process",
    "rt",
    "rt-multi-thread",
    "sync",
] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "v7"] }
zeroize = "1"
ainxt-agent = { path = "../ainxt-agent" }
ainxt-tools = { path = "../ainxt-tools" }
ainxt-tools-api = { path = "../ainxt-tools-api" }
ainxt-workspace-client = { path = "../ainxt-workspace-client" }
ainxt-workspace-types = { path = "../ainxt-workspace-types" }
ainxt-config = { workspace = true }
ainxt-policy = { workspace = true }
# Leaf config value types (RemoteSettings, BoolFlag) for the folder-trust decision.
ainxt-config-types = { workspace = true }
toml = { workspace = true, features = ["preserve_order"] }
dashmap = { workspace = true }
agent-client-protocol = { workspace = true }
ainxt-acp-lib = { workspace = true }
ainxt-codebase-graph = { path = "../ainxt-codebase-graph" }
ainxt-paths = { path = "../ainxt-paths" }
base64 = { workspace = true }
infer = { workspace = true }
sha2 = { workspace = true, features = ["force-soft"] }
bstr = "1.12.1"
hashbrown = "0.16.1"
nohash-hasher = "0.2.0"
rustc-hash = "2.1.1"
nucleo = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
smallvec = { workspace = true }
chrono = { workspace = true }
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25"
ainxt-shell-ast = { workspace = true }
ainxt-pep = { workspace = true }
ainxt-policy-types = { workspace = true }
url = { workspace = true }
ainxt-env = { workspace = true }
humantime-serde = { workspace = true }
prometheus = { workspace = true }
glob = "0.3"
ainxt-sandbox = { path = "../ainxt-sandbox", default-features = false }
ainxt-hooks = { path = "../ainxt-hooks" }
ainxt-hunk-tracker = { path = "../ainxt-hunk-tracker" }
# `metrics` enables the SDK's metric-donation client (periodic Prometheus
# registry gather → OTLP → hub donation pump); see metric_donation_reporter.
ainxt-computer-hub-sdk = { workspace = true, features = ["metrics"] }
ainxt-computer-hub-mcp-adapter = { path = "../../common/ainxt-computer-hub-mcp-adapter" }
ainxt-mcp = { path = "../ainxt-mcp" }
ainxt-file-utils = { path = "../ainxt-file-utils" }
ainxt-auth = { path = "../ainxt-auth" }
ainxt-telemetry = { workspace = true }
ainxt-tty-utils = { workspace = true }
ainxt-sqlite-journal = { workspace = true }
reqwest = { workspace = true }
ainxt-tool-protocol = { workspace = true }
ainxt-tool-runtime = { workspace = true }
ainxt-tool-types = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
urlencoding = "2"
ainxt-fast-worktree = { path = "../ainxt-fast-worktree", features = ["metadata"] }
# tonic: Status/Code mapping for deploy errors in workspace_ops.
tonic = { workspace = true }

ainxt-fsnotify = { path = "../ainxt-fsnotify" }
clap = { workspace = true }
tracing-subscriber = { workspace = true }
# "enable" required for the SDK's spans to record at all.
fastrace = { workspace = true, features = ["enable"] }
ainxt-tracing = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tempfile = { workspace = true }
zstd = { workspace = true }

# Only referenced by the Unix self-daemonize path (fork/setsid/dup2/chdir).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# Only referenced by the Windows self-daemonize path (SetStdHandle).
[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[[bin]]
name = "ainxt-workspace-server"
path = "src/bin/workspace_server.rs"

[[bin]]
name = "workspace-server-probe"
path = "src/bin/workspace_server_probe.rs"

[features]
default = ["sandbox-enforce"]
compression = []
test-support = []
sandbox-enforce = ["ainxt-sandbox/enforce"]
default-bazel = [
    "sandbox-enforce",
    ]

[dev-dependencies]
# `install_scoped` lets the enforcement gates install a process engine without
# leaking it into other tests.
ainxt-policy = { workspace = true, features = ["test-support"] }
filetime = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
ainxt-test-utils = { path = "../../common/ainxt-test-utils" }
# Decode tar.gz archives produced by workspace upload helpers in tests.
flate2 = { workspace = true }
tar = { workspace = true }
dotenvy = { workspace = true }

[package.metadata.cargo-shear]
ignored = ["tokio-tungstenite"]

[lints]
workspace = true
